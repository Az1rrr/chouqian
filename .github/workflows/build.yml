name: 打包桌面应用
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 安装前端依赖
        run: npm install

      - name: 编译 Windows exe
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/
